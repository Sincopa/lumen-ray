name: Android

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      prebuilt:
        description: Verify locally signed APKs already attached to the draft release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    if: ${{ !inputs.prebuilt }}
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: '29.0.14206865'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check release signing settings
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing Android signing setting: $name" >&2
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.1.0" "ndk;${NDK_VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: android/core/go.mod
          cache-dependency-path: android/core/go.sum

      - name: Install gomobile
        working-directory: android/core
        # The tool directive in go.mod pins golang.org/x/mobile.
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          go install golang.org/x/mobile/cmd/gobind

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/lumen-release.jks

      - name: Build APKs
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          LUMEN_ANDROID_KEYSTORE: keystore/lumen-release.jks
          LUMEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMEN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:build

      - name: Verify signatures and 16 KB alignment
        run: |
          tools="$ANDROID_HOME/build-tools/36.1.0"
          for apk in release/android/*.apk; do
            "$tools/apksigner" verify --print-certs "$apk" > /dev/null
            "$tools/zipalign" -c -P 16 4 "$apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lumen-android
          path: release/android/
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release/android/*.apk release/android/SHA256SUMS.txt --clobber

  prebuilt:
    if: ${{ inputs.prebuilt }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          gh release download "v$version" --pattern "Lumen-$version-*.apk" --pattern SHA256SUMS.txt --dir release/android
          cd release/android
          sha256sum --check SHA256SUMS.txt
          for abi in arm arm64 x86_64 universal; do
            test -s "Lumen-$version-$abi.apk"
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install verification tools
        run: sdkmanager --install 'build-tools;36.1.0'

      - name: Verify signatures and 16 KB alignment
        run: |
          set -eu
          tools="$ANDROID_HOME/build-tools/36.1.0"
          version=$(node -p "require('./package.json').version")
          for apk in release/android/*.apk; do
            "$tools/aapt" dump badging "$apk" | grep -F "versionName='$version'"
            "$tools/apksigner" verify --print-certs "$apk" > /dev/null
            "$tools/zipalign" -c -P 16 4 "$apk"
          done
