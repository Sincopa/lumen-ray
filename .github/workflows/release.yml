name: Release Lumen

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check updater signing settings
        shell: pwsh
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_KEY)) {
            throw "Repository secret TAURI_SIGNING_PRIVATE_KEY is missing"
          }

          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $publicKey = $config.plugins.updater.pubkey
          if ([string]::IsNullOrWhiteSpace($publicKey)) {
            throw "plugins.updater.pubkey is missing in src-tauri/tauri.conf.json"
          }
          try {
            $decodedKey = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($publicKey))
          } catch {
            throw "plugins.updater.pubkey is not valid base64"
          }
          if (-not $decodedKey.StartsWith("untrusted comment: minisign public key:")) {
            throw "plugins.updater.pubkey does not contain a minisign public key"
          }

      - name: Check release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version v$version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "lumen-updater-signing-check.txt"
          Set-Content -LiteralPath $probe -Value "lumen updater signing check" -NoNewline
          node node_modules/@tauri-apps/cli/tauri.js signer sign --password= $probe

      - name: Prepare verified Xray core
        shell: pwsh
        run: powershell -NoProfile -File scripts/prepare-core.ps1

      - name: Verify frontend
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      - name: Verify Rust backend
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Verify native local traffic and browser flows
        run: |
          npm run test:smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:e2e

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Lumen v__VERSION__
          releaseBody: Download the Windows installer or portable archive below. Existing installations receive this version through the built-in signed updater.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Prepare and upload final release artifacts (Setup.exe and Portable.zip)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }

          # Build portable archive
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -Mode Portable

          # Prepare standardized Setup executable
          $releaseDir = "release"
          if (-not (Test-Path -LiteralPath "$releaseDir/Lumen-Ray-$version-Setup.exe")) {
            $nsisCandidate = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Where-Object { $_.Name -notmatch '(?i)uninst' } | Select-Object -First 1
            if ($nsisCandidate) {
              Copy-Item -LiteralPath $nsisCandidate.FullName -Destination "$releaseDir/Lumen-Ray-$version-Setup.exe" -Force
            }
          }

          # Upload primary release assets (Setup installer + Portable zip)
          gh release upload $tag "$releaseDir/Lumen-Ray-$version-Setup.exe" "$releaseDir/Lumen-Ray-$version-Portable.zip" --clobber
