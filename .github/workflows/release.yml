name: Release Lumen

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      LUMEN_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
      LUMEN_SIGNING_TRUST_SCOPE: LocalMachine
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Check updater signing settings
        shell: pwsh
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_KEY)) {
            throw "Repository secret TAURI_SIGNING_PRIVATE_KEY is missing"
          }

          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $publicKey = $config.plugins.updater.pubkey
          if ([string]::IsNullOrWhiteSpace($publicKey)) {
            throw "plugins.updater.pubkey is missing in src-tauri/tauri.conf.json"
          }
          try {
            $decodedKey = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($publicKey))
          } catch {
            throw "plugins.updater.pubkey is not valid base64"
          }
          if (-not $decodedKey.StartsWith("untrusted comment: minisign public key:")) {
            throw "plugins.updater.pubkey does not contain a minisign public key"
          }

      - name: Check release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version v$version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Import persistent Windows Code Signing certificate
        timeout-minutes: 3
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci-windows-signing.ps1 -Mode Import

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/prepare-updater-signing.ps1

      - name: Prepare verified Xray core
        shell: pwsh
        run: |
          powershell -NoProfile -File scripts/prepare-core.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 -Mode Runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify frontend
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      - name: Build frontend for browser checks
        run: npm run build

      - name: Verify browser flows
        run: npm run test:e2e

      - name: Upload browser failure reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          if-no-files-found: ignore
          path: test-results/
          retention-days: 7

      - name: Verify Rust backend
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Verify native local traffic
        run: npm run test:smoke

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Lumen v__VERSION__
          releaseBody: Download the Windows installer or portable archive below. Updater metadata and a version-bound signature are included.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Prepare and upload final release artifacts (Setup.exe and Portable.zip)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }

          # Build portable archive
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -Mode Portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Prepare standardized Setup executable
          $releaseDir = "release"
          $nsisCandidate = "src-tauri/target/release/bundle/nsis/Lumen_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $nsisCandidate)) { throw "Missing signed NSIS installer: $nsisCandidate" }
          Copy-Item -LiteralPath $nsisCandidate -Destination "$releaseDir/Lumen-Ray-$version-Setup.exe" -Force

          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci-windows-signing.ps1 -Mode Verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Upload primary release assets (Setup installer + Portable zip)
          gh release upload $tag "$releaseDir/Lumen-Ray-$version-Setup.exe" "$releaseDir/Lumen-Ray-$version-Portable.zip" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Publish only after all final artifacts passed Authenticode verification.
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload signature verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-signature-reports
          if-no-files-found: ignore
          path: |
            artifacts/code-signing/*signatures.json
            artifacts/code-signing/nsis-uninstaller.json

      - name: Remove imported Windows signing key
        if: always()
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci-windows-signing.ps1 -Mode Cleanup
