name: Release Lumen

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The draft comes first, so a release problem fails in seconds rather than
  # after the builds, and every platform uploads to it at the same time.
  draft:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match application version v$version"
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; else tag=v$version; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          # Creating a release can fail for a moment on GitHub's side; retry briefly.
          for attempt in 1 2 3; do
            if gh release create "$tag" --draft --title "Lumen v$version" \
              --notes "Building release assets." --target "$GITHUB_SHA"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

  verify-frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm run check
          npm run lint
          npm run format:check

      - name: Build frontend for browser checks
        run: npm run build

  # Tests and clippy run in the verify jobs at the same time as the builds;
  # publish waits for all of them.
  release-windows:
    needs: draft
    runs-on: windows-latest
    env:
      LUMEN_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
      LUMEN_SIGNING_TRUST_SCOPE: LocalMachine
      RUST_TEST_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Check updater signing settings
        shell: pwsh
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_KEY)) {
            throw "Repository secret TAURI_SIGNING_PRIVATE_KEY is missing"
          }

          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $publicKey = $config.plugins.updater.pubkey
          if ([string]::IsNullOrWhiteSpace($publicKey)) {
            throw "plugins.updater.pubkey is missing in src-tauri/tauri.conf.json"
          }
          try {
            $decodedKey = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($publicKey))
          } catch {
            throw "plugins.updater.pubkey is not valid base64"
          }
          if (-not $decodedKey.StartsWith("untrusted comment: minisign public key:")) {
            throw "plugins.updater.pubkey does not contain a minisign public key"
          }

      - name: Install dependencies
        run: npm ci

      - name: Import persistent Windows Code Signing certificate
        timeout-minutes: 3
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src-tauri/build/ci-windows-signing.ps1 -Mode Import

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File src-tauri/build/prepare-updater-signing.ps1

      - name: Prepare verified Xray core
        shell: pwsh
        run: |
          powershell -NoProfile -File src-tauri/build/prepare-core.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File src-tauri/build/sign-windows.ps1 -Mode Runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build frontend
        run: npm run build

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Lumen v__VERSION__
          # The publish job replaces this with the download table (src-tauri/build/release-notes.mjs).
          releaseBody: Building release assets.
          releaseDraft: true
          prerelease: false
          # Publish writes latest.json once both desktop builds are on the draft.
          uploadUpdaterJson: false
          # No version in asset names, so releases/latest/download/<name> links
          # always serve the newest build: Lumen_x64-setup.exe(.sig).
          releaseAssetNamePattern: '[name]_[arch][setup][ext]'
          args: --config src-tauri/tauri.release.conf.json --bundles nsis

      - name: Prepare and upload final release artifacts (Setup.exe and Portable.zip)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }

          # Build portable archive
          powershell -NoProfile -ExecutionPolicy Bypass -File src-tauri/build/build-release.ps1 -Mode Portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Prepare standardized Setup executable
          $releaseDir = "release"
          $nsisCandidate = "src-tauri/target/release/bundle/nsis/Lumen_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $nsisCandidate)) { throw "Missing signed NSIS installer: $nsisCandidate" }
          Copy-Item -LiteralPath $nsisCandidate -Destination "$releaseDir/Lumen-Ray-Setup.exe" -Force

          powershell -NoProfile -ExecutionPolicy Bypass -File src-tauri/build/ci-windows-signing.ps1 -Mode Verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Upload primary release assets (Setup installer + Portable zip)
          # Stays a draft until the publish job, after macOS is verified too.
          gh release upload $tag "$releaseDir/Lumen-Ray-Setup.exe" "$releaseDir/Lumen-Ray-Portable.zip" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload signature verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-signature-reports
          if-no-files-found: ignore
          path: |
            artifacts/code-signing/*signatures.json
            artifacts/code-signing/nsis-uninstaller.json

      - name: Remove imported Windows signing key
        if: always()
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src-tauri/build/ci-windows-signing.ps1 -Mode Cleanup

  # Runs next to Windows: neither build writes latest.json, publish does.
  release-macos:
    needs: draft
    runs-on: macos-latest
    env:
      RUST_TEST_THREADS: '1'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh -NoProfile -NonInteractive -File src-tauri/build/prepare-updater-signing.ps1

      - name: Prepare verified Xray core
        run: sh src-tauri/build/prepare-core-macos.sh

      - name: Build frontend
        run: npm run build

      - name: Build and upload ad-hoc signed universal app to the draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Lumen v__VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          # Lumen_universal.dmg and Lumen_universal.app.tar.gz(.sig), see release-windows.
          releaseAssetNamePattern: '[name]_[arch][setup][ext]'
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json --bundles app,dmg

      - name: Verify ad-hoc signed bundle
        run: |
          set -eu
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/Lumen.app"
          sh src-tauri/build/verify-macos-bundle.sh "$app"
          ls "$bundle"/dmg/*.dmg

  # The APKs are built locally and uploaded to the draft before the tag is pushed.
  release-android:
    needs: draft
    uses: ./.github/workflows/android.yml
    with:
      prebuilt: true

  verify-windows:
    runs-on: windows-latest
    env:
      LUMEN_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
      LUMEN_SIGNING_TRUST_SCOPE: LocalMachine
      RUST_TEST_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Import persistent Windows Code Signing certificate
        timeout-minutes: 3
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src-tauri/build/ci-windows-signing.ps1 -Mode Import

      - name: Prepare verified Xray core
        shell: pwsh
        run: |
          powershell -NoProfile -File src-tauri/build/prepare-core.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File src-tauri/build/sign-windows.ps1 -Mode Runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build frontend for native checks
        run: npm run build

      - name: Verify Rust backend
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Verify native local traffic
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml native_local_proxy_smoke -- --test-threads=1

      - name: Remove imported Windows signing key
        if: always()
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src-tauri/build/ci-windows-signing.ps1 -Mode Cleanup

  verify-macos:
    runs-on: macos-latest
    env:
      RUST_TEST_THREADS: '1'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Prepare verified Xray core
        run: sh src-tauri/build/prepare-core-macos.sh

      - name: Build frontend for native checks
        run: npm run build

      - name: Verify Rust backend
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  # Publish only after every platform's artifacts passed signature verification
  # and every check passed.
  publish:
    needs:
      [
        verify-frontend,
        verify-windows,
        verify-macos,
        release-windows,
        release-macos,
        release-android,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; else tag=v$version; fi
          node src-tauri/build/updater-manifest.mjs "$tag" --apply
          node src-tauri/build/release-notes.mjs "$tag" --apply
          gh release edit "$tag" --draft=false
